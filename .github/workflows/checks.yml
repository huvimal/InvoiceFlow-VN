name: InvoiceFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -v
        env:
          GROQ_API_KEY: ''
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      - run: python benchmark.py validate
      - name: Exercise benchmark failure accounting without an API
        run: |
          python -c "import subprocess; p = subprocess.run(['python', 'benchmark.py', 'run', '--mode', 'replay', '--split', 'all', '--output', 'reports/ci-replay.json']); assert p.returncode == 1"
      - uses: actions/upload-artifact@v7
        with:
          name: invoiceflow-offline-reports
          path: reports/
